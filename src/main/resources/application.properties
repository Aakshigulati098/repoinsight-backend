spring.application.name=repoinsight-service

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/repoinsight
spring.datasource.username=repoinsight
spring.datasource.password=repoinsight
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=repoinsight-group
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Consumer Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:ignored}
spring.ai.openai.base-url=${OPENAI_BASE_URL:http://localhost:12434/engines/v1}
spring.ai.openai.chat.model=${OPENAI_MODEL:hf.co/Qwen/Qwen2.5-Coder-3B}
spring.ai.openai.chat.temperature=0.2

# Enable embeddings through Docker Model Runner
spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=http://localhost:12434/engines/v1
spring.ai.openai.embedding.api-key=ignored
spring.ai.openai.embedding.model=ai/nomic-embed-text-v1.5

# Enable the existing PostgreSQL vector store
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=false