spring.application.name=repoinsight-service

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/repoinsight
spring.datasource.username=repoinsight
spring.datasource.password=repoinsight
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=repoinsight-group
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Consumer Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.ai.model.chat=openai
spring.ai.openai.api-key=ignored
spring.ai.openai.base-url=http://localhost:12434/engines/v1
spring.ai.openai.chat.model=ai/gemma3:1b-q4_K_M
spring.ai.openai.chat.temperature=0.3

# Direct chat without embeddings
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
